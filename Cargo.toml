[workspace]
resolver = "2"
members = [
    "crates/tessera-core",
    "crates/tessera-guardian",
    "crates/tessera-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/eooo-io/tessera"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JSON Schema validation (lens policy). default-features off avoids pulling
# the HTTP/file reference resolvers (reqwest) — our schema has no remote $refs.
jsonschema = { version = "0.46", default-features = false }

# Database
rusqlite = { version = "0.31", features = ["bundled", "blob", "load_extension", "backup"] }

# Vector index (loaded as SQLite extension)
sqlite-vec = "0.1"

# Crypto
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
blake3 = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / API
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# CLI
clap = { version = "4", features = ["derive"] }
rpassword = "7.5"

# Embedding / ML
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
ndarray = "0.16"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Text extraction
pdf-extract = "0.7"
dom_smoothie = "0.18"

# Image decoding, resizing, and thumbnail encoding
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Feature unification only. Without `log`, zune-jpeg's `warn!` expands to
# nothing in expression position, which rustc 1.97 rejects outright.
zune-jpeg = { version = "0.5", features = ["log"] }

# macOS-native image understanding: ImageIO (HEIC decode) and Vision (OCR)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-vision = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-image-io = "0.3"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# ID generation
ulid = "1"

# JWT for session tokens
jsonwebtoken = "9"

# SSE for activity stream
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio-stream = "0.1"

# macOS Keychain
security-framework = "3"

# Dev / testing
tempfile = "3"
proptest = "1"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
