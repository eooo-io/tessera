[package]
name = "tessera-desktop"
version = "0.1.0"
description = "Tessera cross-platform owner workbench"
authors = ["eooo"]
license = "MIT"
repository = "https://github.com/eooo-io/tessera"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tessera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tessera-core = { path = "../../../crates/tessera-core" }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

# Keep the desktop shell independently buildable so the established Rust
# workspace release gates do not silently acquire platform WebView toolchains.
[workspace]
