[package]
name = "tessera-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
rusqlite = { workspace = true }
sqlite-vec = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
ort = { workspace = true }
ndarray = { workspace = true }
tokenizers = { workspace = true }
pdf-extract = { workspace = true }
dom_smoothie = { workspace = true }
image = { workspace = true }
# See the workspace manifest: pulled in only to enable zune-jpeg's `log`
# feature so its no-op macros still expand to valid expressions.
zune-jpeg = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
security-framework = { workspace = true }
zeroize = { workspace = true }

# macOS-native decode (HEIC) and OCR. The image pipeline keeps every other
# stage portable; only these two stages bind to platform frameworks.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-vision = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-image-io = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
tokio-test = { workspace = true }
tempfile = { workspace = true }
